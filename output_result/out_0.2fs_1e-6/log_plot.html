function niceTicks(lo, hi, n) {

  if (ticks[0] > lo) ticks.unshift(+(ticks[0] - stepv).toPrecision(12));
  if (ticks[ticks.length - 1] < hi) ticks.push(+(ticks[ticks.length - 1] + stepv).toPrecision(12));
